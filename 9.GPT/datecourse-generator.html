<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
  <div>
    <input id="start" placeholder="출발지 (예: 홍대입구역)">
    <div id="waypoints"></div>
    <button onclick="addWaypoint()">+ 경유지 추가</button>
    <input id="end" placeholder="도착지 (예: 남산타워)">
    <button onclick="findRoute()">경로 찾기</button>
  </div>

  <div id="map" style="height: 500px;"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </script>
  <script>

    const map = L.map('map').setView([37.5665, 126.9784], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let routeLayer;

    function addWaypoint() {
      const div = document.createElement('div');
      div.innerHTML = `<input class="waypoint" placeholder="경유지 (예: 북촌한옥마을)">`;
      document.getElementById('waypoints').appendChild(div);
    }

    async function geocode(address) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
      const res = await fetch(url);
      const data = await res.json();

      if (!data.length) {
        throw new Error(`주소를 찾을 수 없습니다: ${address}`);
      }

      return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
    }

    async function findRoute() {
      try {
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const waypointInputs = document.querySelectorAll('.waypoint');

        let addresses = [start];

        waypointInputs.forEach(input => {
          if (input.value.trim()) {
            addresses.push(input.value);
          }
        });

        addresses.push(end);

        // 주소 → 좌표
        const coords = [];
        for (let addr of addresses) {
          coords.push(await geocode(addr));
        }

        // OSRM은 [lng, lat] 순서!
        const osrmCoords = coords.map(c => `${c[1]},${c[0]}`).join(';');

        const url = `https://router.project-osrm.org/route/v1/driving/${osrmCoords}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();

        const routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

        if (routeLayer) map.removeLayer(routeLayer);

        routeLayer = L.polyline(routeCoords, { color: 'hotpink', weight: 5 }).addTo(map);
        map.fitBounds(routeLayer.getBounds());

        // 마커 표시
        coords.forEach(c => L.marker(c).addTo(map));

      } catch (err) {
        alert(err.message);
      }
    }


  </script>

</body>

</html>
