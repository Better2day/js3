<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: black;
    }

    canvas {
      border: 1px solid white;
    }

    #scoreText {
      color: white;
    }
  </style>
</head>

<body>
  <div id="scoreText">Score: <span id="score"><!-- 점수가 올 곳 --></span></div>
  <canvas id="aniCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('aniCanvas');
    const context = canvas.getContext('2d');

    let pacman = {
      x: 200,
      y: 200,
      r: 30,
      speed: 2,
    };
    let baseAngle = 0;
    let startAngle = 0.2 * Math.PI; // baseAngle + (0.2 % 2 * Math.PI);
    let endAngle = 1.8 * Math.PI; // baseAngle + (1.8 % 2 * Math.PI) ; 
    let mouthOpen = 1; // 1 = open , -1 = close
    const mouthRange = 0.35; // 입이 벌어지는 최대 각도
    const margin = 0.05;
    const mouthSpeed = 0.05;
    let xTowards = 1; // x축 이동 방향. 1 = 오른쪽으로, -1 왼쪽으로, 0 정지 (y축으로 이동중. 대각선 이동 불가 = 1차원으로만 이동 가능)
    let yTowards = 0; // y축 이동 방향. 1 = 아랫쪽으로, -1 윗쪽으로, 0 정지 (x축으로 이동중)

    let score = 0;

    function updateMouth() {
      if (xTowards == 1 && startAngle > 0.3 * Math.PI || startAngle < 0.05) {
        mouthOpen = -mouthOpen;
        // mouthOpen *= -1;
      } else if (yTowards == 1 && (startAngle > 0.8 * Math.PI || startAngle < 0.55 * Math.PI)) { // startAngle > baseAngle 0.5 * Math.PI || startAngle < baseAngle + 0.05 * Math.PI (margin)
        mouthOpen = -mouthOpen;
      } else if (xTowards == -1 && (startAngle > 1.3 * Math.PI || startAngle < 1.05 * Math.PI)) { // startAngle > baseAngle 1.0 * Math.PI
        mouthOpen = -mouthOpen;
      } else if (yTowards == -1 && (startAngle > 1.8 * Math.PI || startAngle < 1.55 * Math.PI)) { // startAngle > baseAngle 1.5 * Math.PI
        mouthOpen = -mouthOpen;
      }
      startAngle += mouthSpeed * mouthOpen;
      endAngle -= mouthSpeed * mouthOpen;
      // console.log(`startAngle = ${startAngle}, endAngle = ${endAngle}`);
    }

    function drawPacman() {
      context.beginPath();
      context.moveTo(pacman.x, pacman.y);
      context.arc(pacman.x, pacman.y, pacman.r, startAngle, endAngle);

      context.fillStyle = 'yellow';
      context.fill();
      context.closePath();
    }

    function updatePosition() {
      pacman.x += pacman.speed * xTowards;
      pacman.y += pacman.speed * yTowards;

      if (pacman.x + pacman.r > canvas.width) {
        // 화면을 벗어나면 같은 축의 반대편으로 이동
        pacman.x = pacman.r;
      } else if (pacman.x - pacman.r < 0) {
        pacman.x = canvas.width - pacman.r;
      } else if (pacman.y + pacman.r > canvas.height) {
        pacman.y = pacman.r;
      } else if (pacman.y - pacman.r < 0) {
        pacman.y = canvas.height - pacman.r;;
      }
    }

    function pacmanMovementHandler(ev) {
      switch (ev.key) {
        case 'ArrowUp':
          yTowards = -1;
          xTowards = 0;
          startAngle = 1.7 * Math.PI;
          endAngle = 1.3 * Math.PI;
          break;
        case 'ArrowDown':
          yTowards = 1;
          xTowards = 0;
          startAngle = 0.7 * Math.PI;
          endAngle = 0.3 * Math.PI;
          break;
        case 'ArrowLeft':
          xTowards = -1;
          yTowards = 0;
          startAngle = 1.2 * Math.PI;
          endAngle = 0.8 * Math.PI;
          break;
        case 'ArrowRight':
          xTowards = 1
          yTowards = 0;
          startAngle = 0.2 * Math.PI;
          endAngle = 1.8 * Math.PI;
          break;
      }
    }

    document.addEventListener('keydown', ev => pacmanMovementHandler(ev));

    let foods = [];

    function generateFood() {
      const uneaten = foods.filter(food => !food.eaten).length;

      // 원하는 갯수만큼 반복해서 음식 만들기 (지금은 3개)
      for (let i = uneaten; i < 3; i++) {
        const food = {
          x: Math.floor(Math.random() * (canvas.width - 40)) + 20, // 20 ~ (canvas.width - 20) 사이에 만듦
          y: Math.floor(Math.random() * (canvas.height - 40)) + 20,
          radius: 10,
          eaten: false
        };
        foods.push(food);
      }
    }


    function drawFood() {
      foods.forEach(food => {
        // 먹은 건 안 그린다
        if (!food.eaten) {
          context.beginPath();
          context.moveTo(food.x, food.y);
          context.arc(food.x, food.y, food.radius, 0, 2 * Math.PI);
          context.fillStyle = 'white';
          context.fill();
          context.closePath();
        }
      });
    }

    function clearScreen() {
      context.clearRect(0, 0, canvas.width, canvas.height);
    }

    const scoreSpan = document.getElementById('score');

    function checkFoodEaten() {
      // pacman의 위치와 먹이가 같은 곳(근처)에 있는지 확인해서, 먹었으면 표시
      foods.forEach(food => {
        const dx = food.x - pacman.x;
        const dy = food.y - pacman.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < pacman.r && !food.eaten) {
          food.eaten = true;
          score += 10;
          scoreSpan.innerText = score;
        }
        // console.log('음식과 팩맨 사이의 거리', dist);
      });
      foods = foods.filter(food => !food.eaten);
    }

    /*************************
     *  여기가 메인 루프
     *************************/
    function animatePacman() {
      clearScreen();
      drawPacman();
      generateFood();
      drawFood();
      updateMouth();
      updatePosition();
      checkFoodEaten();

      requestAnimationFrame(animatePacman);
    }

    animatePacman();
  </script>
</body>

</html>
