<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: black;
    }

    canvas {
      border: 1px solid white;
    }
  </style>
</head>

<body>
  <canvas id="aniCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('aniCanvas');
    const context = canvas.getContext('2d');

    let startAngle = 0.2 * Math.PI;
    let endAngle = 1.8 * Math.PI;
    let mouthOpen = 1; // 1 = open , -1 = close
    let mouthSpeed = 0.05;
    let positionX = 200;
    let positionY = 200;
    const pacmanSize = 30;
    let directionX = 1;
    let directionY = 0;
    const pacmanSpeed = 5;
    // let curDirection = 'Horizontal';


    function updateMouth() {
      if (startAngle > 0.3 * Math.PI || startAngle < 0.05 & Math.PI) {
        mouthOpen = -mouthOpen;
        // mouthOpen *= -1;
      }
      startAngle += mouthSpeed * mouthOpen;
      endAngle -= mouthSpeed * mouthOpen;
    }

    function drawPacman() {
      context.clearRect(0, 0, canvas.width, canvas.height);

      context.beginPath();
      context.moveTo(positionX, positionY);
      context.arc(positionX, positionY, pacmanSize, startAngle, endAngle);
      context.fillStyle = 'yellow';
      context.fill();
      context.closePath();
    }

    function updatePosition() {
      positionX += pacmanSpeed * directionX;
      positionY += pacmanSpeed * directionY;

      if (positionX > canvas.width - pacmanSize) {
        positionX = canvas.width - pacmanSize; // 화면을 벗어나려고 하면, 그 자리에 멈춤
      }
      if (positionY > canvas.height - pacmanSize) {
        positionY = canvas.height - pacmanSize;
      }
      if (positionX < pacmanSize) {
        positionX = pacmanSize;
      }
      if (positionY < pacmanSize) {
        positionY = pacmanSize;
      }
    }

    function animatePacman() {
      updateMouth();
      drawPacman();
      updatePosition();

      // positionX += 5 * directionX;
      // positionY += 5 * directionX;
      requestAnimationFrame(animatePacman);
    }

    animatePacman();

    document.addEventListener('keydown', ev => {
      console.log('눌린 키', ev.key);
      switch (ev.key) {
        case 'ArrowUp':
          directionY = -1;
          directionX = 0;
          // curDirection = 'Vertical';
          // directionX = 0;
          // positionY -= 20;
          break;
        case 'ArrowDown':
          directionY = 1;
          directionX = 0;
          // curDirection = 'Vertical';
          // directionX = 0;
          // positionY += 20;
          break;
        case 'ArrowLeft':
          directionX = -1;
          directionY = 0;
          // curDirection = 'Horizontal';
          // directionY = 0;
          // positionX -= 20;
          break;
        case 'ArrowRight':
          directionX = 1
          directionY = 0;
          // curDirection = 'Horizontal';
          // directionY = 0;
          // positionX += 20;
          break;
      }
    })

  </script>
</body>

</html>
