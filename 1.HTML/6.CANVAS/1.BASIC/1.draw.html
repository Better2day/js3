<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    canvas {
      border: 1px solid #000;
    }
  </style>
</head>

<body>
  <canvas id="myCanvas" width="400" height="200"></canvas>

  <script>
    const canvas = document.getElementById('myCanvas');
    const context = canvas.getContext('2d'); // 2D 그림 그릴 공간을 가져온다.

    // 1. 사각형 그리기
    context.fillStyle = '#FF0000'; // RGB
    context.fillRect(50, 50, 100, 100); // (x, y, width, height);

    context.strokeStyle = 'BLUE'; // 파란 테두리 사각형
    context.strokeRect(50, 100, 100, 80);

    // 2. 라인 그리기
    context.strokeStyle = '#00FF00';
    context.lineWidth = 3;
    context.beginPath(); // 경로 시작
    context.moveTo(200, 50); // 시작점
    context.lineTo(300, 130); // 끝점
    context.stroke(); // 실제로 그리기
    context.closePath(); // 경로 끝

    context.beginPath(); // 경로 시작
    context.moveTo(190, 70); // 시작점
    context.lineTo(290, 150); // 끝점
    context.stroke(); // 실제로 그리기
    context.closePath(); // 경로 끝

    // 소스 코드에서 아랫쪽에 있는 것이 더 상위 레이어 (z-index 값이 더 높은 것과 동일한 효과)
    // 아래 원 위로 선을 그리고 싶으면, 이 선 소스코드를 원 아래로 옮겨야 한다.
    context.strokeStyle = '#FF0000';
    context.lineWidth = 5;
    context.beginPath(); // 경로 시작
    context.moveTo(350, 0); // 시작점
    context.lineTo(350, 150); // 끝점
    context.stroke(); // 실제로 그리기
    context.closePath(); // 경로 끝

    // 3. 원 그리기
    // arc(x, y, radius, startAngle, endAngle, counterclockwise); 원 또는 호 그리기
    context.fillStyle = '#00FF00';
    context.beginPath();
    context.arc(350, 50, 30, 0, 2 * Math.PI); // 각도: degree, radian (2PI = 360 )
    context.fill(); // 내용 채우기

    context.fillStyle = '#0000FF';
    context.beginPath();
    context.moveTo(350, 150); // 이걸 안 해주면 원형이 아니라 호 형태로 그려진다.
    // context.arc(350, 150, 30, 0, 0.5 * Math.PI, true);
    // context.arc(350, 150, 30, 0, 0.5 * Math.PI, false);
    context.arc(350, 150, 30, 0, 0.5 * Math.PI); // 6번쨰 인자로 false 준 것과 동일
    context.fill(); // 내용 채우기
    // X축 우측을 0도로 시작해서 시계 방향으로 도는 것이 기본값 (y축 아랫쪽이 90도)
    // ※ 보통 사용하는 사사분면(반시계 방향) 좌표와 다르므로 주의!
    // 사사분면 / JS arc 좌표
    //   2 1        3 4
    //   3 4        2 1
    // 6번째 인자로 anticlockwise 값을 true로 설정하면 그리는 방향을 시계 방향으로 설정
    // ※ 시계 방향으로 돌며 그려도, 좌표 자체는 JS arc 좌표가 그대로 유지되므로 주의!
  </script>

</body>

</html>
