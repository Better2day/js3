<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
  <h1>Tailwind button</h1>
  <h1 class="text-3xl font-bold">Tailwind button</h1>
  <!-- <button>버튼 1</button> -->
  <div class="container mx-auto p-4">
    <button class="bg-blue-300 text-black font-semilight py-2 px-4 rounded">버튼 1</button>
    <button class="bg-blue-400 text-white py-2 px-4 rounded">버튼 2</button>
    <button class="bg-blue-500 text-white font-bold py-2 px-4 rounded">버튼 3</button>
  </div>

  <div class="container mx-auto p-4">
    <button class="bg-blue-300 hover:bg-blue-500 text-black font-semilight py-2 px-4 rounded">버튼 1</button>
    <button class="bg-blue-500 hover:bg-blue-300 text-black font-semilight py-2 px-4 rounded">버튼 1</button>
    <button class="bg-green-500 hover:bg-green-700 text-white py-2 px-4 rounded">버튼 2</button>
    <button class="bg-green-700 hover:bg-green-900 text-white py-2 px-4 rounded">버튼 2</button>
    <button class="bg-red-400 hover:bg-yellow-400 text-white font-bold py-2 px-4 rounded">버튼 3 (Hover)</button>
    <button class="bg-red-600 hover:bg-purple-400 text-white font-bold py-2 px-4 rounded">버튼 3 (Hover)</button>
  </div>

  <div class="container mx-auto p-4">
    <p class="text-xl text-gray-800 mt-2">아무말 대잔치 !</p>
    <p class="text-lg text-gray-600 mt-2">아무말 대잔치 !</p>
    <p class="text-sm text-gray-400 mt-2">아무말 대잔치 !</p>
  </div>

  <div class="container mx-auto p-4">
    <div class="grid grid-cols-3 gap-10">
      <div class="bg-blue-500 p-4 text-black">column 1</div>
      <div class="bg-green-500 p-4 text-white">column 2</div>
      <div class="bg-red-500 p-4 text-white">column 3</div>
    </div>
  </div>
</body>

</html>
