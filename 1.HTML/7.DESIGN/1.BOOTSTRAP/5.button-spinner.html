<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <h1>로딩 버튼 구현하기</h1>
  <button id="loadBtn" class="btn btn-primary me-2 px-3">
    <span class="spinner-border spinner-border-sm d-none"></span>
    <!-- <span class="spinner-border spinner-border-sm invisible"></span> -->
    <!-- invisible은 안 보이지만 공간은 차지. d-none은 점유 공간도 사라짐 -->
    <span class="button-text">Load Data</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script>
    const loadBtn = document.getElementById('loadBtn');
    const spinner = loadBtn.querySelector('.spinner-border');
    const loadBtnText = loadBtn.querySelector('.button-text');

    loadBtn.addEventListener('click', () => {
      loadBtn.disabled = true;
      spinner.classList.remove('d-none');
      loadBtn.classList.remove('px-3');
      // loadBtn.classList.add('px-4');
      loadBtnText.textContent = 'Loading';
    })
  </script>
</body>

</html>
