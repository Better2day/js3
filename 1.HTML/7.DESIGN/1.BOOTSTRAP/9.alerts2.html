<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
</head>

<body>
  <h1>Bootstrap Alerts !</h1>

  <!-- 경보 + 닫기 버튼 -->
  <div class="container my-4">
    <div class="alert alert-danger alert-dismissive fade show">닫을 수 있는 알림 메시지입니다.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </div>

  <!-- 아래는 자동으로 닫을 예정 -->
  <div class="container my-4">
    <div id="auto-close-alert" class="alert alert-warning alert-dismissive fade show">닫을 수 있는 알림 메시지입니다.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </div>

  <script>
    setTimeout(() => {
      const alert = document.getElementById('auto-close-alert');
      if (alert) {
        alert.classList.remove('show'); // 숨김 방법 1
        // alert.classList.add('fade'); // 예쁘게 fade하면서 사라진다. (차이 잘 모르겠음)
        alert.remove(); // 숨김 방법 2
      }
    }, 2000); // 3초 후에 안에 있는 콜백을 실행

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>

</html>
