<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <h1>로딩 버튼 구현하기</h1>
  <!-- Load button -->
  <button id="loadBtn" class="btn btn-primary me-2 px-3">
    <span class="spinner-border spinner-border-sm d-none"></span>
    <span class="button-text">Load Data</span>
  </button>

  <!-- Clear button -->
  <button id="clearBtn" class="btn btn-danger me-2" disabled>
    <span class="spinner-border spinner-border-sm d-none"></span>
    <span class="button-text">Clear Data</span>
  </button>

  <div id="result" class="mt-4"></div>
  <!-- <div id="result" class="mt-4">결과가 출력될 곳</div> -->

  <script>

    /***************
    /* Load button
     ***************/
    const loadBtn = document.getElementById('loadBtn');
    const loadSpinner = loadBtn.querySelector('.spinner-border');
    const loadBtnText = loadBtn.querySelector('.button-text');
    const result = document.getElementById('result');

    loadBtn.addEventListener('click', async () => {
      loadBtn.disabled = true;
      clearBtn.disabled = true;
      loadSpinner.classList.remove('d-none');
      loadBtnText.textContent = 'Loading...';
      loadBtn.classList.replace('px-3', 'px-2');

      // 일부러 0.5초 쉬기 (로딩이 너무 빨라서 일부러 늦춤)
      await new Promise(resolve => setTimeout(resolve, 500)); // 0.5초 기다렸다가 끝

      // fetch로 데이터 불러오기. jsonplaceholder
      const randomId = Math.floor(Math.random() * 10) + 1; // 1~10

      try {
        const res = await fetch(`https://jsonplaceholder.typicode.com/posts/${randomId}`);
        const data = await res.json();
        result.innerHTML = `
        <div class="alert alert-success">
          <h5>${data.title}</h5>
          <p>${data.body}</p>
        </div>
        `;
      } catch (error) {
        result.innerHTML = `
        <div class="alert alert-danger">
          데이터를 가져오는데 실패했습니다.
          </div>
        `;
      } finally {
        // 데이터 잘 받아왔으면, 스피너 돌던 버튼 원복
        loadBtn.disabled = false;
        clearBtn.disabled = false;
        loadSpinner.classList.add('d-none');
        loadBtnText.textContent = 'Load Data';
        loadBtn.classList.replace('px-2', 'px-3');
      }
    })

    /****************
    /* Clear button
    *****************/
    const clearBtn = document.getElementById('clearBtn');
    const clrSpinner = clearBtn.querySelector('.spinner-border');
    const clearBtnText = clearBtn.querySelector('.button-text');

    console.log(loadBtnText);
    console.log(clearBtnText);

    clearBtn.addEventListener('click', async () => {
      if (result.textContent == '') return false;
      clearBtn.disabled = true;
      loadBtn.disabled = true;
      result.innerHTML = `
      <div class="alert alert-warning">
        <span class="spinner-border spinner-border-sm text-danger"></span>
        삭제중...
      </div>
      `;
      clrSpinner.classList.remove('d-none');
      clearBtnText.innerText = 'Clearing';

      await new Promise(resolve => setTimeout(resolve, 500));

      result.textContent = '';
      clearBtn.disabled = false;
      loadBtn.disabled = false;
      clrSpinner.classList.add('d-none');
      clearBtnText.innerText = 'Clear Data';
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
</body>

</html>
