<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <h1>로딩 버튼 구현하기</h1>
  <button id="loadBtn" class="btn btn-primary me-2 px-3">
    <span class="spinner-border spinner-border-sm d-none"></span>
    <!-- <span class="spinner-border spinner-border-sm invisible"></span> -->
    <!-- invisible은 안 보이지만 공간은 차지. d-none은 점유 공간도 사라짐 -->
    <span class="button-text">Load Data</span>
  </button>

  <div id="result" class="mt-4"><!-- 결과가 출력될 곳 --></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script>
    const loadBtn = document.getElementById('loadBtn');
    const spinner = loadBtn.querySelector('.spinner-border');
    const loadBtnText = loadBtn.querySelector('.button-text');
    const result = document.getElementById('result');

    loadBtn.addEventListener('click', async () => {
      loadBtn.disabled = true;
      spinner.classList.remove('d-none');
      loadBtnText.textContent = 'Loading...';
      loadBtn.classList.replace('px-3', 'px-2');

      // 일부러 1초 쉬기 (로딩이 너무 빨라서 일부러 늦춤)
      await new Promise(resolve => setTimeout(resolve, 1000)); // 1초 기다렸다가 끝

      // fetch로 데이터 불러오기. jsonplaceholder
      const randomId = Math.floor(Math.random() * 10) + 1; // 1~10

      try {
        const res = await fetch(`https://jsonplaceholder.typicode.com/posts/${randomId}`);
        const data = await res.json();
        result.innerHTML = `
        <div class="alert alert-success">
          <h5>${data.title}</h5>
          <p>${data.body}</p>
        </div>
        `;
      } catch (error) {
        result.innerHTML = `
        <div class="alert alert-danger">
          데이터를 가져오는데 실패했습니다.
          </div>
        `;
      } finally {
        // 데이터 잘 받아왔으면, 스피너 돌던 버튼 원복
        loadBtn.disabled = false;
        spinner.classList.add('d-none');
        loadBtnText.textContent = 'Load Data';
        loadBtn.classList.replace('px-2', 'px-3');
      }
    })
  </script>
</body>

</html>
