<!DOCTYPE html>
<html>

<head>
  <title>My title</title>
  <style>
    .container {
      height: 400px;
      position: relative;
    }

    .box1,
    .box2 {
      /* border: 1px solid red; */
      width: 100%;
      height: 100%;
      opacity: 0.7;
      background: lightskyblue;
      text-align: center;
      position: absolute;
    }

    .overlay {
      z-index: 1;
      top: 200px;
      background: lightgreen;
    }

    .box1:hover {
      z-index: 5;
      opacity: 1.0;
      font-size: 30px;
      transform-style: all;
      transition-duration: 2s;
    }
  </style>
</head>

<body>
  <!-- 가장 좋은 것은 semantic tag로 잘 감싸서 의미를 부여하는 것이 좋다. -->
  <div class="container">
    <div class="box1">
      상단 내용
    </div>
    <div class="box2 overlay">
      하단 내용
    </div>

  </div>
</body>

</html>
