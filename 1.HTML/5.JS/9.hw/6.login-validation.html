<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      /* position: relative; */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    form {
      width: 500px;
      height: 450px;
      border: 1px solid black;
      padding: 10px;
    }

    label,
    input,
    button {
      display: block;
    }

    label {
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      /* margin-bottom: 10px; */
    }

    span {
      display: inline-block;
      font-size: 9px;
      color: red;
      margin-bottom: 10px;
    }

    .il {
      display: inline-block;
      width: auto;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <form method="POST" id="signUp">
    <h1>회원 가입 폼</h1>
    <label for="userId">사용자명</label>
    <!-- <input type="text" placeholder="3~10 글자로 입력하세요" minlength="3" maxlength="10"> -->
    <input type="text" id="userId" placeholder="3~10 글자로 입력하세요">
    <span id="userIdAlert"></span>

    <label for="password">비밀번호</label>
    <input type="password" id="password" placeholder="대소문자, 숫자/특수문자 포함 8자 이상">
    <span id="passwordAlert"></span>

    <label for="userName">이름</label>
    <!-- <input type="text" placeholder="1~10 글자로 입력하세요" minlength="1" maxlength="10"> -->
    <input type="text" id="userName" placeholder="1~10 글자로 입력하세요">
    <span id="userNameAlert"></span>

    <label for="birthday">생년월일</label>
    <input type="date" id="birthday">
    <span id="birthdayAlert"></span>

    <label>관심 분야 (최소 1개, 최대 3개 선택)</label>
    <input type="checkbox" name="fav" value="fav1" class="il">관심 분야 1</input>
    <input type="checkbox" name="fav" value="fav2" class="il">관심 분야 2</input>
    <input type="checkbox" name="fav" value="fav3" class="il">관심 분야 3</input>
    <input type="checkbox" name="fav" value="fav4" class="il">관심 분야 4</input>
    <span id="favAlert"></span>

    <button id="submit">제출</button>
  </form>

  <script>
    function validateForm() {
      // alert('까꿍!'); // 제출하면 페이지가 이동하므로 console.log는 확인 불가능
      event.preventDefault(); // console.log 확인하려고 추가
      // 이거 초기화 함수로 분리해야 함
      // 개인정보 항목별 경고창 전부 초기화
      const alertSpanArray = document.querySelectorAll('span');
      alertSpanArray.forEach(span => {
        span.textContent = null;
      })
      // 개인정보 항목별 input 빨간 테두리 전부 초기화
      const inputArray = document.querySelectorAll('input');
      inputArray.forEach(input => {
        if (input.style.borderColor != 'green') { // 유효성 검사를 통과해서 초록색 테두리가 된 항목만 제외하고 초기화
          input.style.borderColor = '';
        }
      })

      const userId = document.getElementById('userId');
      const password = document.getElementById('password');
      const userName = document.getElementById('userName');
      const birthday = document.getElementById('birthday');
      const favList = document.querySelectorAll('.il');
      const regExpUpperCase = /[A-Z]/g;
      const regExpLowerCase = /[a-z]/g;
      const regExpNumber = /[0-9]/g;
      const regExpSpecialChar = /[!@#$^&*()]/g;

      let favCnt = 0;
      // for (let fav of favList) {
      favList.forEach(fav => {
        if (fav.checked) favCnt++;
      });

      // 아래 textContent, borderColor 변경하는 작업 함수로 만들어서, 인자만 다르게 해서 호출하면 될 듯
      if (userId.value.length < 3 || userId.value.length > 10) {
        document.getElementById('userIdAlert').textContent = '사용자명은 3 글자 이상, 10 글자 이하로 입력해야 합니다.';
        document.getElementById('userId').style.borderColor = 'red';
      } else if (password.value.length < 8) {
        document.getElementById('passwordAlert').textContent = '비밀번호는 8자 이상 입력해야 합니다.';
        document.getElementById('password').style.borderColor = 'red';
        // 이 조건문까지 왔으면 이전 항목인 ID 유효성 검사는 통과한 것이므로 초록색 테두리
        document.getElementById('userId').style.borderColor = 'green';
      } else if (
        !regExpUpperCase.test(password.value) ||
        !regExpLowerCase.test(password.value) ||
        !regExpNumber.test(password.value) ||
        !regExpSpecialChar.test(password.value)) {
        document.getElementById('passwordAlert').textContent = '비밀번호에는 대소문자, 숫자/특수문자가 각각 1자 이상씩 포함되어 있어야 합니다.';
        document.getElementById('password').style.borderColor = 'red';
      } else if (userName.value.length < 1 || userName.value.length > 10) {
        document.getElementById('userNameAlert').textContent = '사용자명은 1 글자 이상, 10 글자 이하로 입력해야 합니다.';
        document.getElementById('userName').style.borderColor = 'red';
        document.getElementById('password').style.borderColor = 'green';
      } else if (birthday.value == '' || birthday.value == null) {
        document.getElementById('birthdayAlert').textContent = '생년월일을 입력하세요';
        document.getElementById('birthday').style.borderColor = 'red';
        document.getElementById('userName').style.borderColor = 'green';
      } else if (favCnt < 1 || favCnt > 3) {
        document.getElementById('favAlert').textContent = '관심 분야는 최소 1개에서 최대 3개까지 선택해야 합니다.';
        document.getElementById('birthday').style.borderColor = 'green';
      }

      // console.log('대문자 존재:', regExpUpperCase.test(password.value));
      // console.log('소문자 존재:', regExpLowerCase.test(password.value));
      // console.log('숫자 존재:', regExpNumber.test(password.value));
      // console.log('특수문자 존재:', regExpSpecialChar.test(password.value));
    }

    // document.getElementById('signUp').addEventListener('submit', validateForm);
    document.getElementById('submit').addEventListener('click', validateForm);
  </script>
</body>

</html>
