<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="5-2.calculator.css">
</head>

<body>
  <div id="calculator">
    <div id="expression"></div>
    <div id="current">0</div>
    <div id="buttonGrid">
      <!-- 키보드로 편리하게 숫자를 입력할 수 있도록 accessKey 속성 추가
          (Edge의 경우 Alt + 키 조합으로 이용 가능.
           연산자는 대부분 Shift 키까지 조합해야 하므로 복잡해서 제외, C 등 일부 키도 안 되서 제외  -->
      <button id="1">+</button>
      <button id="2">-</button>
      <button id="3">*</button>
      <button id="4">/</button>
      <button id="5" accessKey="7">7</button>
      <button id="6" accessKey="8">8</button>
      <button id="7" accessKey="9">9</button>
      <button id="8">=</button>
      <button id="9" accessKey="4">4</button>
      <button id="10" accessKey="5">5</button>
      <button id="11" accessKey="6">6</button>
      <button id="12">C</button>
      <button id="13" accessKey="1">1</button>
      <button id="14" accessKey="2">2</button>
      <button id="15" accessKey="3">3</button>
      <button id="16" accessKey="0">0</button>
    </div>
  </div>

  <script src="5-2.calculator.js"></script>
</body>

</html>
