<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100dvw;
      height: 100dvh;
      position: relative;
    }

    div#watchScreen {
      position: relative;
      left: 40%;
      top: 40%;
      width: 200px;
      height: 200px;
      border: 1px solid #ccc;
      text-align: center;
      /* padding: 70px 0; */
    }

    span#stopwatch {
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div id="watchScreen">
    <!-- <time id="stopwatch" datetime="00:00.00">00:00.00</time> -->
    <span id="stopwatch">00:00.00</span>
    <button id="startBtn">start</button>
    <button id="stopBtn">stop</button>
    <button id="resetBtn">reset</button>
  </div>

  <script>
    const stopwatch = document.getElementById('stopwatch');
    let intervalId = null;
    document.getElementById('watchScreen').addEventListener('click', e => {
      // console.log('e.target: ', e.target);
      // console.log('e.currentTarget: ', e.currentTarget);
      // console.log('event.target: ', event.target);
      // console.log('event.currentTarget: ', event.currentTarget);
      if (e.target.id == 'startBtn') {
        const startDate = new Date();
        intervalId = setInterval(() => {
          const currentDate = new Date();
          const difference = currentDate - startDate;
          // stopwatch.innerText = `00:00.${Math.floor(currentDate.getMilliseconds() / 10) - Math.floor(startDate.getMilliseconds() / 10)}`; // 밀리초는 빼면 minus 숫자가 나와서 아래처럼 처리
          // stopwatch.innerText = `${(currentDate.getMinutes() - startDate.getMinutes()).toString().padStart(2, '0')}:${(currentDate.getSeconds() - startDate.getSeconds()).toString().padStart(2, '0')}.${Math.floor(currentDate.getMilliseconds() / 10).toString().padStart(2, '0')}`; // 소수점 2자리(10ms)까지 표기. 이것도 seconds에서 minus가 나올 때가 있음. 아마 계속 하다 보면 minutes에서도 같은 문제가 발생할 듯
          // difference (milliseconds)를 직접 MM:SS.mm 형태로 변환
          // 100 -> 00:00.10
          // 1000 -> 00:01.00
          // 60000 -> 01:00.00
          // 606050 -> 10:06.50
          stopwatch.innerText =
            Math.floor(difference / (60 * 1000)).toString().padStart(2, '0') + ':' +
            Math.floor(difference % (60 * 1000) / 1000).toString().padStart(2, '0') + '.' +
            Math.floor(difference % (60 * 1000) % 1000 / 10).toString().padStart(2, '0'); // 소수점 2자리(10ms)까지 표기
        }, 10);
      } else if (e.target.id == 'stopBtn') {
        clearInterval(intervalId);
      } if (e.target.id == 'resetBtn') {
        clearInterval(intervalId);
        stopwatch.innerText = '00:00.00';
      }
    });
  </script>

</body>

</html>
