<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      width: 100dvw;
      height: 100dvh;
      background-color: #ccc;
    }

    div#watchScreen {
      position: relative;
      left: 35%;
      top: 35%;
      width: 210px;
      height: 100px;
      border: 1px solid #ccc;
      background-color: white;
      border-radius: 10px;
      font-size: 32px;
      box-shadow: 5px 5px 10px #777;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    span#stopwatch {
      /* grid-column-start: 1;
      grid-column-end: 4; */
      grid-column: 1 / span 3;
      /* justify-self: center;
      align-self: center; */
      /* shorthand property for align-self and justify-self */
      place-self: center;
    }

    button {
      width: 50px;
      height: 30px;
      /* justify-self: center;
      align-self: center; */
      place-self: center;
      background-color: #ccc;
      border: 2px solid #aaa;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div id="watchScreen">
    <span id="stopwatch">00:00.00</span>
    <button id="startBtn">start</button>
    <button id="stopBtn" disabled>stop</button>
    <button id="resetBtn" disabled>reset</button>
  </div>

  <script>
    const stopwatch = document.getElementById('stopwatch');
    const buttons = document.querySelectorAll('button');
    let intervalId = null;
    // Event Delegation (EventListener를 최소로 만들기 위해서 버튼의 부모 노드인 div에만 추가하고 타겟으로 로직 구분)
    document.getElementById('watchScreen').addEventListener('click', e => {
      // console.log('e.target: ', e.target);
      // console.log('e.currentTarget: ', e.currentTarget);
      // console.log('event.target: ', event.target);
      // console.log('event.currentTarget: ', event.currentTarget);
      if (e.target.id == 'startBtn') {
        const startDate = new Date();
        intervalId = setInterval(() => {
          const currentDate = new Date();
          const difference = currentDate - startDate;
          // [Issue] 아래는 문제 발생 코드
          // stopwatch.innerText = `${currentDate.getMinutes() - startDate.getMinutes()}:${currentDate.getSeconds() - startDate.getSeconds()}.${Math.floor(currentDate.getMilliseconds() / 10)}`;
          // 스탑와치 작동중 초에서 minus가 나올 때가 있음. 아마 계속 하다 보면 분에서도 같은 문제가 발생할 듯 →
          // 생각해보니 당연. startDate의 시간 부분이 00:05.45 였다고 가정하고, currentDate의 시간 부분이 00:59.99를 넘어서 01:00.00이 되는 순간 초 부분의 차이는 -5가 될 수밖에 없다. 이걸 해결하려면 산수를 하듯이 윗 단위(분)까지 끌어와서 계산해야 한다.
          // [개선] 현재 시간 - 스탑와치 시작 시간인 difference (milliseconds)를 직접 MM:SS.mm 형태로 변환
          //     100 -> 00:00.10
          //   1,000 -> 00:01.00
          //  60,000 -> 01:00.00
          // 606,050 -> 10:06.50
          stopwatch.innerText =
            Math.floor(difference / (60 * 1000)).toString().padStart(2, '0') + ':' + // 분
            Math.floor(difference % (60 * 1000) / 1000).toString().padStart(2, '0') + '.' + // 초
            Math.floor(difference % (60 * 1000) % 1000 / 10).toString().padStart(2, '0'); // ms. 소수점 2자리(10ms)까지 표기
        }, 10);
        // buttons.forEach(button => {
        //   button.toggleAttribute('disabled');
        // });
        buttons.forEach(button => button.toggleAttribute('disabled', button.id == 'startBtn'));
        // 조건이 참이면 추가만, 거짓이면 제거만 (무조건 토글 아님):
        // start 버튼은 disabled 추가, 나머지 버튼은 disabled 제거
      } else if (e.target.id == 'stopBtn') {
        clearInterval(intervalId);
        // buttons.filter(button => button.id != 'resetBtn').forEach(button => button.toggleAttribute('disabled'));
        buttons.forEach(button => button.toggleAttribute('disabled', button.id == 'stopBtn'));
        // stop 버튼은 disabled 추가, 나머지 버튼은 disabled 제거
      } if (e.target.id == 'resetBtn') {
        clearInterval(intervalId);
        buttons.forEach(button => button.toggleAttribute('disabled', button.id != 'startBtn'));
        // start 버튼은 disabled 제거, 나머지 버튼은 disabled 추가
        stopwatch.innerText = '00:00.00';
      }
    });
  </script>

</body>

</html>
