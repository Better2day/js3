<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100dvw;
      height: 100dvh;
      position: relative;
    }

    div#watchScreen {
      position: relative;
      left: 40%;
      top: 40%;
      width: 200px;
      height: 200px;
      border: 1px solid #ccc;
      text-align: center;
      padding: 50px 0;
    }

    span#stopwatch {
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div id="watchScreen">
    <span id="stopwatch">00:00.00</span>
    <button id="startBtn">start</button>
    <button id="stopBtn">stop</button>
    <button id="resetBtn">reset</button>
  </div>

  <script>
    const stopwatch = document.getElementById('stopwatch');
    const startBtn = document.getElementById('startBtn');

    startBtn.addEventListener('click', function () {
      console.log('[익명 함수 내부] e.currentTarget:', event.currentTarget);
      console.log('[익명 함수 내부] this === e.currentTarget: ', this === event.currentTarget);
    }); // 익명 함수 안에서는 this가 이벤트의 currentTarget을 가리킨다.

    startBtn.addEventListener('click', e => {
      console.log('[화살표 함수 내부] e.currentTarget:', e.currentTarget);
      console.log('[화살표 함수 내부] this === e.currentTarget: ', this === e.currentTarget);
    }); // 화살표 함수는 this, argument, super에 대한 바인딩이 없다.
  </script>
</body>

</html>
