<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h1 {
      color: green;
      background-color: yellowgreen;
    }
  </style>
</head>

<body>
  <h1 id="title">Hello DOM Button</h1>
  <!-- 
  <button onclick="changeColor1()">빨강 글자, 노랑 배경</button>
  <button onclick="changeColor2()">파랑 글자, 하늘색 배경</button>
  -->
  <button id="btn1" onclick="changeColor(event)">헤딩 색상 토글</button>
  <button id="btn2" onclick="changeColor(event)">헤딩 색상 토글</button>
  <button onclick="removeStyleAttr()">색상 초기화</button>

  <script>
    function changeColor(e) {
      let heading = document.getElementById('title');
      if (e.currentTarget.id == 'btn1') {
        console.log(e.target);
        console.log(e.currentTarget);
        heading.style.color = 'red';
        heading.style.backgroundColor = 'yellow';
        heading.style.width = '300px';
      } else if (e.currentTarget.id == 'btn2') {
        heading.style.color = 'blue';
        heading.style.backgroundColor = 'skyblue';
        heading.style.width = '300px';
      }
    }
    function resetColor() {
      let heading = document.getElementById('title');
      // heading.removeAttribute('style');
      heading.style.color = 'green';
      heading.style.backgroundColor = '';
      heading.style.width = '';
    }
    function removeStyleAttr() {
      let heading = document.getElementById('title');
      heading.removeAttribute('style');
    }
    /*
        function changeColor1() {
          let heading = document.getElementById('title');
          heading.style.color = 'red';
          heading.style.backgroundColor = 'yellow';
          heading.style.width = '300px';
        }
        function changeColor2() {
          let heading = document.getElementById('title');
          heading.style.color = 'blue';
          heading.style.backgroundColor = 'skyblue';
          heading.style.width = '300px';
        }
     */
  </script>
</body>

</html>
