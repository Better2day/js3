<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>버튼을 통한 숫자 제어</h1>
  <input type="text" value=777 placeholder="숫자/글자 아무거나 입력">
  <div id="result">0</div>
  <div>
    <button onclick="numberInc()">+1</button>
    <button onclick="numberDec()">-1</button>
  </div>

  <script>
    function numberInc() {
      let div = document.getElementById('result');
      div.innerText = parseInt(div.innerText) + 1;
      // console.log('+1 버튼 눌림');
    }

    function numberDec() {
      let div = document.getElementById('result');
      div.innerText = parseInt(div.innerText) - 1;
      // console.log('-1 버튼 눌림');
    }
  </script>
</body>

</html>
