<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Hello DOM</h1>
  <button onclick="sayHello()" style="margin-bottom: 10px">Hello</button>
  <div id="greeting"></div>
  <script>
    function sayHello() {
      // console.log('Say Hello');
      document.getElementById('greeting').innerHTML = 'Say hello<br>Say hello again';
    }
  </script>
</body>

</html>
