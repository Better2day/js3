<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    input {
      width: 100px;
      margin-bottom: 10px;
    }

    #progressBar {
      position: relative;
      width: 100%;
      background-color: #f3f3f3;
    }

    #progress {
      width: 0%;
      height: 30px;
      background-color: #4caf50;
      z-index: 1;
    }

    #progressNum {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 30px;
      text-align: center;
      align-content: center;
      font-size: 16px;
      z-index: 2;
    }
  </style>
</head>

<body>
  <h1>Progress Bar Timer !</h1>
  <input id="seconds" type="number" placeholder="초를 입력하세요" min="2" max="10">
  <button id="startBtn">시작</button>
  <button id="resetBtn" disabled>초기화</button>
  <div id="progressBar">
    <div id="progress"></div>
    <!-- 진행 바 위에 추가로 진행률 %도 표시 -->
    <div id="progressNum"></div>
  </div>
</body>

<script>
  const progress = document.getElementById('progress');
  const progressNum = document.getElementById('progressNum');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  let intervalId = null;

  startBtn.addEventListener('click', () => {
    const seconds = document.getElementById('seconds').value;
    const increment = 100 / seconds;
    let current = 0;
    startBtn.setAttribute('disabled', '');
    resetBtn.removeAttribute('disabled', '');

    intervalId = setInterval(() => {
      current += increment;
      if (current >= 100) {
        clearInterval(intervalId);
        startBtn.removeAttribute('disabled');
      }
      progress.style.width = current + '%';
      progressNum.textContent = Math.round(current) + '%';
    }, 1000);
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(intervalId);
    progress.style.width = '0%';
    progressNum.textContent = '';
    startBtn.removeAttribute('disabled');
    resetBtn.setAttribute('disabled', '');
  });
</script>

</html>
