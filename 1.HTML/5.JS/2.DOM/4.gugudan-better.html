<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>구구단 콘솔</h1>
  <input id="userInput" type="number" placeholder="단을 입력하시오" style="margin-bottom: 10px">
  <button onclick="gugudan()">구구단 출력</button>

  <div id="result"></div>

  <script>
    function gugudan() {
      let danInput = document.getElementById('userInput').value;
      let resultDiv = document.getElementById('result');

      // 만약 입력이 없으면
      if (danInput == '') {
        console.log('단을 입력하세요');
        resultDiv.innerHTML = '단을 입력하세요';
        return -1;
      }

      resultDiv.innerHTML = '';

      for (let i = 1; i <= 9; i++) {
        resultDiv.innerHTML += danInput + ' x ' + i + ' = ' + danInput * i + '<BR>';
      }
    }
  </script>
</body>

</html>
