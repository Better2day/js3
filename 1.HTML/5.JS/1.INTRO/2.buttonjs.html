<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h1 {
      color: blue;
    }
  </style>
</head>

<body>
  <h1 id="title">JS Hello World!</h1>
  <button onclick="sayHello();">Hello Button</button>
  <script>
    function sayHello() {
      // console.log("Hello 함수");
      h1 = document.getElementById('title');
      h1.style.color = 'red';
    }
  </script>
</body>

</html>
