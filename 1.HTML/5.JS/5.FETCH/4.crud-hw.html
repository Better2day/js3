<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>typicode.com 사이트에 CRUD 해보기</h1>
  <div>
    <h3>포스트 생성하기</h3>
    <button id="createPost">포스트 생성</button>
  </div>
  <div>
    <h3>포스트 전체 조회하기</h3>
    <button id="readAllPost">포스트 전체 조회</button>
  </div>
  <br>
  <hr>
  <br>
  <input type="text" id="postId" placeholder="Post ID를 입력해주세요 (1~100)" style="width:180px">
  <div>
    <h3>포스트 한 개 조회하기</h3>
    <button id="readPost">포스트 한 개 조회</button>
  </div>
  <div>
    <h3>포스트 전체 수정하기</h3>
    <button id="putPost">포스트 수정</button>
  </div>
  <div>
    <h3>포스트 일부 수정하기</h3>
    <button id="patchPost">포스트 수정</button>
  </div>
  <div>
    <h3>포스트 삭제하기</h3>
    <button id="deletePost">포스트 삭제</button>
  </div>
  <div>
    <h3>공통 결과를 출력할 곳</h3>
    <div id="result"></div>
  </div>

  <script>
    const requestURL = 'https://jsonplaceholder.typicode.com/posts';

    // POST 생성
    document.getElementById('createPost').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/posts', {
        method: 'POST',
        body: JSON.stringify({
          title: '글 작성 테스트 2',
          body: '글 작성 테스트 2',
          userId: 5,
        }),
        headers: {
          'Content-Type': 'application/json; charset=UTF-8'
        }
      })
        .then(response => response.json())
        .then(json => {
          // console.log(json)
          document.getElementById('result').innerText = JSON.stringify(json);
        });
    });

    // POST 전체 조회
    document.getElementById('readAllPost').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/posts')
        .then(response => response.json())
        // .then(json => console.log(json));
        .then(json => {
          // console.log(json);
          Array.from(json).forEach(obj => {
            document.getElementById('result').innerHTML += `<p>title: ${obj.title}<br>body: ${obj.body}</p>`;
          })
        });
    })

    // POST 한 개 조회
    document.getElementById('readPost').addEventListener('click', () => {
      fetch(`https://jsonplaceholder.typicode.com/posts/${document.getElementById('postId').value}`)
        .then(response => response.json())
        .then(json => {
          document.getElementById('result').innerHTML = `<p>id: ${json.id}<br>title: ${json.title}<br>body: ${json.body}</p>`;
        });
    })


    // POST 전체 수정
    document.getElementById('putPost').addEventListener('click', () => {
      fetch(`https://jsonplaceholder.typicode.com/posts/${document.getElementById('postId').value}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json; charset=UTF-8'
        },
        body: JSON.stringify({
          id: document.getElementById('postId').value,
          title: '제목 수정',
          body: '본문 수정 (모든 정보 수정)',
          userId: 1
        })
      })
        .then(response => response.json())
        .then(json => {
          document.getElementById('result').innerHTML = `<p>ID: ${json.id}<br>user ID: ${json.id}<br>title: ${json.title}<br>body: ${json.body}</p>`;
        });
    })

    // POST 일부 수정
    document.getElementById('patchPost').addEventListener('click', () => {
      fetch(`https://jsonplaceholder.typicode.com/posts/${document.getElementById('postId').value}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json; charset=UTF-8'
        },
        body: JSON.stringify({
          body: '본문만 수정',
        })
      })
        .then(response => response.json())
        .then(json => {
          document.getElementById('result').innerHTML = `<p>id: ${json.id}<br>title: ${json.title}<br>body: ${json.body}</p>`;
        });
    })


    // POST 삭제
    document.getElementById('deletePost').addEventListener('click', () => {
      fetch(`https://jsonplaceholder.typicode.com/posts/${document.getElementById('postId').value}`, {
        method: 'DELETE'
      })
        .then(response => response.json())
        .then(json => {
          document.getElementById('result').innerHTML = `<p>id: ${json.id}<br>title: ${json.title}<br>body: ${json.body}</p>`;
        });
    })
  </script>
</body>

</html>
