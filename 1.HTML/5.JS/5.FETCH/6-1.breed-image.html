<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Dog Breed Image</title>
</head>

<body>
  <h1></h1>

</body>
<h1>Random Dog Breed Image</h1>
<label for="breedSelector">Choose a breed: </label>
<select id="breedSelector">
</select>
<button id="fetchButton">Fetch Image</button>
<div id="imageContainer">
  <!-- 결과를 넣을 공간 -->
  <!-- <img src="강아지 사진 URL"> -->
</div>
<script>

  document.addEventListener('DOMContentLoaded', async () => {
    const response = await fetch('https://dog.ceo/api/breeds/list/all');
    const jsonData = await response.json();
    const breeds = Object.keys(jsonData.message);

    // console.log(breeds);
    const imageContainer = document.getElementById('imageContainer');
    const breedSelector = document.getElementById('breedSelector');

    imageContainer.innerHTML = '';
    breedSelector.innerHTML = '';

    breeds.forEach(breed => {
      // imageContainer.innerHTML += `${breed}<br>`;
      breedSelector.innerHTML += `<option value=${breed}>${breed}</option>`;
    });
  });


  document.getElementById('fetchButton').addEventListener('click', () => {
    console.log(breedSelector);
    console.log(breedSelector.value);
    fetch(`https://dog.ceo/api/breed/${breedSelector.value}/images/random`)
      .then(response => response.json()) // 가장 짧은 코드일뿐, 가장 좋은 코드는 아니다.
      .then(data => {
        const imageUrl = data.message;
        // document.getElementById('imageContainer').innerText = JSON.stringify(data);

        const img = document.createElement('img');
        img.src = imageUrl;
        // img.style.width = '200px'; // 고정 크기
        img.style.maxWidth = '100%'; // 원본 크기인데, 최대치가 화면을 벗어나지 않도록

        const imageContainer = document.getElementById('imageContainer');
        imageContainer.innerHTML = ''; // 기존에 있던 내용을 삭제
        imageContainer.appendChild(img);
      });
  });

</script>

</html>
