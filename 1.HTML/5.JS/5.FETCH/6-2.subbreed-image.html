<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Dog Breed Image</title>
</head>

<body>
  <h1></h1>

</body>
<h1>Random Dog Breed Image</h1>
<label for="mainBreedSelector">Choose a main breed: </label>
<select id="mainBreedSelector">
</select>
<label for="subBreedSelector">Choose a sub-breed: </label>
<select id="subBreedSelector">
</select>
<button id="fetchButton">Fetch Image</button>
<div id="imageContainer">
  <!-- 결과를 넣을 공간 -->
  <!-- <img src="강아지 사진 URL"> -->
</div>
<script>
  const imageContainer = document.getElementById('imageContainer');
  const mainBreedSelector = document.getElementById('mainBreedSelector');
  const subBreedSelector = document.getElementById('subBreedSelector');
  console.log(imageContainer);
  console.log(mainBreedSelector);
  console.log(subBreedSelector);

  // 웹페이지가 로드됐을 때 main breed 목록을 받아온다.
  document.addEventListener('DOMContentLoaded', async () => {
    const response = await fetch('https://dog.ceo/api/breeds/list/all');
    const data = await response.json();
    const mainBreeds = Object.keys(data.message);

    imageContainer.innerHTML = '';
    mainBreedSelector.innerHTML = '';

    mainBreeds.forEach(breed => {
      mainBreedSelector.innerHTML += `<option value=${breed}>${breed}</option>`;
    });
  });

  // Fetch Button
  document.getElementById('fetchButton').addEventListener('click', () => {
    // console.log(mainBreedSelector);
    // console.log(mainBreedSelector.value);
    let fetchURL;
    if (mainBreedSelector.value == '') {
      imageContainer.innerText = '이미지를 불러오는 데 실패했습니다';
      return -1;
    }

    if (subBreedSelector.value == '') {
      fetchURL = `https://dog.ceo/api/breed/${mainBreedSelector.value}/images/random`;
      // https://dog.ceo/api/breed/hound/images/random
    } else {
      fetchURL = `https://dog.ceo/api/breed/${mainBreedSelector.value}/${subBreedSelector.value}/images/random`;
      // https://dog.ceo/api/breed/hound/afghan/images/random 
    }

    fetch(fetchURL)
      .then(response => response.json()) // 가장 짧은 코드일뿐, 가장 좋은 코드는 아니다.
      .then(data => {
        const imageUrl = data.message;

        const img = document.createElement('img');
        img.src = imageUrl;
        // img.style.width = '200px'; // 고정 크기
        img.style.maxWidth = '100%'; // 원본 크기인데, 최대치가 화면을 벗어나지 않도록

        imageContainer.innerHTML = ''; // 기존에 있던 내용을 삭제
        imageContainer.appendChild(img);
      });
  });

  document.getElementById('mainBreedSelector').addEventListener('change', () => {
    fetch(`https://dog.ceo/api/breed/${mainBreedSelector.value}/list`)
      .then(response => response.json())
      .then(data => {
        const subBreeds = data.message;

        subBreedSelector.innerHTML = '';
        subBreeds.forEach(subBreed => {
          subBreedSelector.innerHTML += `<option value=${subBreed}>${subBreed}</option>`;
        });
      });
  });
</script>

</html>
