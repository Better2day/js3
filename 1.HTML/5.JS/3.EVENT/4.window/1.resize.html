<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>(Browser) Window Event - Resize</h1>

  <script>
    window.addEventListener('resize', () => {
      console.log('윈도우 창 크기가 변하는 중...');
      const width = window.innerWidth;
      const height = window.innerHeight;
      console.log(`윈도우 사이즈가 ${width} x ${height}로 변경되었습니다.`);
    })

    // (과거에는) 윈도우 사이즈를 바꿀 수가 있었다.
    // 그러나 각종 광고나 악성코드 사이트에서 악용해서, 차단되었다.
    // window.resizeTo(800, 600);
  </script>

</body>

</html>
