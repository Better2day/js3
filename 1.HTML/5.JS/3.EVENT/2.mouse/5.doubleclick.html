<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #click {
      width: 200px;
      height: 50px;
      border: 1px solid red;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Double click event</h1>
  <div id="divArea">여기를 한 번 클릭해볼까?</div>

  <script>
    const divArea = document.getElementById('divArea');

    divArea.addEventListener('click', () => {
      console.log('까꿍! div 레이어를 클릭했습니다.');
    });
    divArea.addEventListener('dblclick', () => {
      console.log('까꿍! div 레이어를 더블클릭했습니다.');
    });
  </script>
</body>

</html>
