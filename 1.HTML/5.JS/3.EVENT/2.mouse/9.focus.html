<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Focus event</h1>
  <input type="text" id="myInput" placeholder="글자를 입력하시오">
  <p id="lengthDisplay"></p> <!-- 입력된 글자 길이를 출력할 곳 -->

  <script>
    document.getElementById('myInput').addEventListener('focus', () => {
      console.log('여기 포커스가 발생했습니다.');
    })

    document.getElementById('myInput').addEventListener('blur', () => {
      console.log('여기 아웃포커스/언포커스/블러가 발생했습니다.');
      const inputText = document.getElementById('myInput').value;
      const inputTextLength = inputText.length;
      document.getElementById('lengthDisplay').textContent = `입력된 글자수는 ${inputTextLength} 개입니다.`;
    });
  </script>
</body>

</html>
