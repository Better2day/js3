<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #clickArea {
      height: 100px;
      background-color: lightblue;
    }
  </style>
</head>

<body>
  <h1>Context Menu</h1>
  <div id="clickArea">우클릭해보세요</div>

  <script>
    document.getElementById('clickArea').addEventListener('contextmenu', (ev) => {
      console.log('컨텍스트 메뉴가 열림');
      console.log('이벤트 상세 내역: ', ev);
      ev.preventDefault();
      alert('우클릭이 금지되어 있습니다.');
    })
    /*     document.addEventListener('contextmenu', (ev) => {
          ev.preventDefault();
          alert('우클릭이 금지되어 있습니다.');
        }) */
  </script>
</body>

</html>
