<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #myDiv {
      width: 200px;
      height: 200px;
      background-color: aquamarine;
    }
  </style>
</head>

<body>
  <div id="myDiv">Mouseover Test Area</div>
  <script>
    document.getElementById('myDiv').addEventListener('mouseover', () => {
      console.log('Mouse is over');
    });
    document.getElementById('myDiv').addEventListener('mouseout', () => {
      console.log('Mouse is out');
    });
    document.getElementById('myDiv').addEventListener('mousemove', (ev) => {
      // console.log('마우스가 움직이는 동안의 정보를 담아서 나에게 줄 이벤트: ', ev);
      console.log(`마우스 이동중. 좌표 위치: (${ev.clientX}, ${ev.clientY})`);
    });
  </script>

</body>

</html>
