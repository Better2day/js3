<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #body {
      position: relative;
    }

    #alertBox {
      position: absolute;
      top: 350px;
      left: 350px;
      width: 320px;
      height: 200px;
      font-size: 32px;
      font-weight: 500;
      color: red;
      /* display: none; */
      opacity: 1;
      visibility: visible;
    }

    /* 
    #alertBox.show {
      opacity: 1;
      visibility: visible;
      transition: none;
    } */

    #alertBox.hidden {
      /* display: block; */
      opacity: 0;
      transition: opacity 3s;
      /* visibility: hidden; */
      /* transition: all 3s; */
    }
  </style>
</head>

<body>
  <h1>typicode.com 사이트에 CRUD 해보기</h1>
  <div>
    <h3>포스트 생성하기</h3>
    <button id="createPost">포스트 생성</button>
  </div>
  <br>
  <hr>
  <br>
  <input type="text" id="postId" placeholder="Post ID를 입력해주세요 (1~100)" style="width:180px">
  <button id="prevBtn">
    << </button><button id="nextBtn">>></button>
      <div>
        <h3>포스트 조회하기</h3>
        <button id="readPost">포스트 조회</button>
      </div>
      <div>
        <h3>포스트 수정하기</h3>
        <button id="updatePost">포스트 수정</button>
      </div>
      <div>
        <h3>포스트 삭제하기</h3>
        <button id="deletePost">포스트 삭제</button>
      </div>
      <div>
        <h3>공통 결과를 출력할 곳</h3>
        <div id="result"></div>
      </div>
      <div id="alertBox" class="hidden">경고창</div>

      <script>
        const requestURL = 'https://jsonplaceholder.typicode.com/posts';

        function validateInput() {
          const postId = parseInt(document.getElementById('postId').value.trim());
          if (Number.isNaN(postId) || postId < 1) {
            alertBox.textContent = '1~100 사이 숫자를 입력해주세요';
            alertBox.classList.remove('hidden');
            alertBox.style.visibility = 'visible';
            setTimeout(() => {
              alertBox.classList.add('hidden');

              setTimeout(() => {
                alertBox.textContent = '';
                alertBox.style.visibility = 'hidden';
              }, 3000)
            }, 1000);

            return false;
          }

          return true;
        }

        document.getElementById('createPost').addEventListener('click', () => {
          const myPost = {
            title: 'sesac',
            body: 'seoul',
            id: 100
          };

          createPost(myPost);
        });

        document.getElementById('readPost').addEventListener('click', readPost);

        document.getElementById('updatePost').addEventListener('click', () => {
          const myUpdatedPost = {
            id: 1,
            title: '제목 수정',
            body: '본문 수정',
            userId: 1
          }
          updatePost(myUpdatedPost);

        });

        document.getElementById('deletePost').addEventListener('click', () => {
          const deletePostId = document.getElementById('postId').value;
          deletePost(deletePostId);
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
          const postId = document.getElementById('postId');
          if (postId.value > 1) {
            postId.value--;
          }
          readPost();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
          const postId = document.getElementById('postId');
          if (postId.value < 100) {
            postId.value++;
          }
          readPost();
        });

        function createPost(post) {
          fetch(requestURL, {
            method: 'POST',
            headers: {
              'Content-type': 'application/json; charset=UTF-8'
            },
            body: JSON.stringify(post)
          })
            .then(response => response.json())
            .then(data => document.getElementById('result').innerText = JSON.stringify(data))
            .catch(error => alert(error));
        }

        function readPost() {
          if (!validateInput()) {
            return false;
          }
          const readFirstPost = `${requestURL}/${document.getElementById('postId').value}`;
          fetch(readFirstPost)
            .then(response => response.json())
            .then(data => document.getElementById('result').innerText = JSON.stringify(data))
            .catch(err => console.log(err));
        }

        function updatePost(newPost) {
          if (!validateInput()) {
            return false;
          }
          const updateFirstPost = `${requestURL}/${document.getElementById('postId').value}`;
          const queriedPost = (document.getElementById('result').innerText != '') ?
            JSON.parse(document.getElementById('result').innerText) : '';
          const inputPostId = document.getElementById('postId').value;

          if (queriedPost == '' || inputPostId == '' || parseInt(queriedPost?.id) != parseInt(inputPostId.trim())) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = '현재 조회된 포스트만 수정할 수 있습니다';
            alertBox.classList.remove('hidden');
            alertBox.style.visibility = 'visible';
            setTimeout(() => {
              alertBox.classList.add('hidden');

              setTimeout(() => {
                alertBox.textContent = '';
                alertBox.style.visibility = 'hidden';
              }, 3000)
            }, 1000);
            return false;
          }

          fetch(updateFirstPost, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newPost) // 객체 → 문자 (네트워크 전송을 위해서)
          })
            .then(response => response.json()) // 문자 → 객체
            .then(data => document.getElementById('result').innerText = JSON.stringify(data)) // 객체 → 문자
            // 왜 문자 → 객체로 변환했다가, 다시 객체 → 문자로 바꾸는가? 그냥 문자 상태로 출력하면 되지 않을까? X
            // response는 여러 정보를 가지고 있는 중첩 객체
            // response.json() 함수를 통해서 객체 → 문자 변환 뿐만 아니라, 사용자가 주로 필요로 하는 body만 반환
            // 그래서 도로아미타불 작업 같아보이지만, 위 변환을 두 번 거치지 않으면 response 전체 객체가 출련된다.
            .catch(err => console.log(err));
        }

        function deletePost(postId) {
          if (!validateInput()) {
            return false;
          }
          const deletePost = `${requestURL}/${postId}`;
          const queriedPost = (document.getElementById('result').innerText != '') ?
            JSON.parse(document.getElementById('result').innerText) : '';
          const inputPostId = document.getElementById('postId').value;

          if (queriedPost == '' || inputPostId == '' || parseInt(queriedPost?.id) != parseInt(inputPostId.trim())) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = '현재 조회된 포스트만 삭제할 수 있습니다';
            alertBox.classList.remove('hidden');
            alertBox.style.visibility = 'visible';
            setTimeout(() => {
              alertBox.classList.add('hidden');

              setTimeout(() => {
                alertBox.textContent = '';
                alertBox.style.visibility = 'hidden';
              }, 3000)
            }, 1000);
            return false;
          }

          fetch(deletePost, {
            method: 'DELETE'
          })
            .then(response => response.json())
            .then(data => document.getElementById('result').innerText = JSON.stringify(data))
            .catch(err => console.log(err));
        }
      </script>
</body>

</html>
