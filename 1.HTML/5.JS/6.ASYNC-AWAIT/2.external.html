<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>남에게 요청해서 정보 받아와서 표현하기</h2>
  <button id="loadContent">불러오기</button>
  <div id="result"></div>

  <script>
    document.getElementById('loadContent').addEventListener('click', async () => {
      // console.log('버튼 눌림');
      // placehodler 사이트에서 100개의 글 중에서 1번 글을 가져온다.
      const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
      if (!response.ok) {
        throw new Error('Network error !');
      }
      const data = await response.json(); // 오류가 없으면 bytestream을 json 객체로 변환해서 반환
      document.getElementById('result').innerHTML =
        `<p><strong>타이틀:</strong> ${data.title}</p><p><strong>바디:</strong> ${data.body}`;
    })
  </script>
</body>

</html>
