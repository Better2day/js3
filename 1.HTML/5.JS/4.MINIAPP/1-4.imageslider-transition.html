<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gallery {
      position: relative;
      width: 400px;
      height: 400px;
      overflow: hidden;
      transition: 1s;
    }

    .gallery img {
      position: absolute;
      width: 400px;
      height: 400px;
      z-index: 1;
      transition: 1s;
    }

    #img1,
    #img2,
    #img3 {
      left: 0;
      opacity: 0.1;
    }

    #img1 {
      opacity: 1;
    }

    #buttonLayer {
      position: absolute;
      left: 0px;
      width: 400px;
      height: 400px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.3;
    }

    button {
      padding: 2px 7px;
    }

    button:not(:disabled) {
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="gallery">
    <div id='buttonLayer'>
      <button id="prevBtn" disabled>&lt;</button>
      <button id="nextBtn">&gt;</button>
    </div>
    <img id="img1" src="images/puppy1.jpg" class="origin">
    <img id="img2" src="images/puppy2.jpg" class="origin">
    <img id="img3" src="images/puppy3.jpg" class="origin">
  </div>
  <script>

    const prevBtn = document.getElementById('prevBtn');
    const nextvBtn = document.getElementById('nextvBtn');

    const IMAGE_WIDTH = 400;
    const images = document.querySelectorAll('img');

    // 슬라이드 이미지 전체 초기화 (left 초기값 설정)
    for (let image of images) {
      image.style.left = (image.id.slice(-1) - 1) * IMAGE_WIDTH + 'px';
    }

    prevBtn.addEventListener('click', () => {
      for (let image of images) {
        // 이미지를 순회하면서 각각의 left 값을 이미지 폭만큼 증가시킴 (오른쪽으로 슬라이드)
        const left = parseInt(image.style.left.split('px', 1));
        image.style.left = left + IMAGE_WIDTH + 'px';
        // 첫 이미지에 도달하면 이전 버튼 비활성화
        if (image.id.slice(-1) == 1 && left + IMAGE_WIDTH == 0) {
          prevBtn.setAttribute('disabled', '');
        } else { // 그 외에는 다음 버튼 활성화
          nextBtn.removeAttribute('disabled');
        }
        // 현재 표시할 이미지 외에는 거의 투명하게 설정해서, transition을 자연스럽게 보이도록 변경
        image.style.opacity = (left + IMAGE_WIDTH == 0) ? 1 : 0.1;
      }
    })
    nextBtn.addEventListener('click', () => {
      for (let image of images) {
        // 이미지를 순회하면서 각각의 left 값을 이미지 폭만큼 감소시킴 (왼쪽으로 슬라이드)
        const left = parseInt(image.style.left.split('px', 1));
        image.style.left = left - IMAGE_WIDTH + 'px';
        // 마지막 이미지에 도달하면 다음 버튼 비활성화
        if (image.id.slice(-1) == images.length && left - IMAGE_WIDTH == 0) {
          nextBtn.setAttribute('disabled', '');
        } else { // 그 외에는 이전 버튼 활성화
          prevBtn.removeAttribute('disabled');
        }
        image.style.opacity = (left - IMAGE_WIDTH == 0) ? 1 : 0.1;
      }
    })
  </script>
</body>

</html>
