<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    .gallery {
      position: relative;
      display: flex;
      justify-content: space-between;
      width: 400px;
      height: 400px;
      border: 1px dotted orange;
      margin-top: 20px;
      overflow: hidden;
      transition: 1s;
    }

    .gallery img {
      position: absolute;
      width: 400px;
      height: 400px;
      cursor: pointer;
      z-index: 1;
      transition: 1s;
    }

    #img1,
    #img2,
    #img3 {
      left: 0;
    }

    #buttonLayer {
      position: absolute;
      left: 0px;
      width: 400px;
      height: 400px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="gallery">
    <div id='buttonLayer'>
      <button id="prevBtn" disabled>&lt;</button>
      <button id="nextBtn">&gt;</button>
    </div>
    <img id="img1" src="images/puppy1.jpg" class="origin">
    <img id="img2" src="images/puppy2.jpg" class="origin">
    <img id="img3" src="images/puppy3.jpg" class="origin">
  </div>
  <script>

    const prevBtn = document.getElementById('prevBtn');
    const nextvBtn = document.getElementById('nextvBtn');

    const IMAGE_WIDTH = 400;
    const images = document.querySelectorAll('img');

    // 슬라이드 이미지 전체 초기화 (left 초기값 설정)
    for (let image of images) {
      image.style.left = (image.id.slice(-1) - 1) * IMAGE_WIDTH + 'px';
      console.log(image.style.left);
    }

    prevBtn.addEventListener('click', () => {
      for (let image of images) {
        const left = parseInt(image.style.left.split('px', 1));
        if (image.id.slice(-1) == 1 && left == 0) {
          // prevBtn.setAttribute('disabled', '');
          break;
        }
        image.style.left = left + IMAGE_WIDTH + 'px';
      }
    })
    nextBtn.addEventListener('click', () => {
      for (let image of images) {
        const left = parseInt(image.style.left.split('px', 1));
        if (image.id.slice(-1) == 1 && left == -1 * IMAGE_WIDTH * (images.length - 1)) {
          // nextBtn.setAttribute('disabled', '');
          break;
        }
        image.style.left = left - IMAGE_WIDTH + 'px';
      }
    })
  </script>
</body>

</html>
