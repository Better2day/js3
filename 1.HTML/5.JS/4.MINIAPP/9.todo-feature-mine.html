<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .completed {
      text-decoration: line-through;
    }
  </style>
</head>

<body>
  <h1>To-do List</h1>
  <input type="text" id="new-todo" placeholder="할 일을 입력하시오">
  <button id="add-todo">입력</button>
  <!-- 할 일을 아래에 표시할 예정 -->
  <ul id="todo-list">

  </ul>

  <script>
    // 1. 버튼을 가져온다.
    const addBtn = document.getElementById('add-todo');
    // 2. 버튼 클릭을 작동시킨다.
    addBtn.addEventListener('click', () => {
      addTodo();
    });
    // 개선 3. 엔터를 통해서 입력한다.
    // document.addEventListener('keydown', ev => {
    //   if (ev.key == 'Enter') {
    //     addTodo();
    //   }
    // });
    const newTodo = document.getElementById('new-todo');
    newTodo.addEventListener('keydown', ev => {
      if (ev.key == 'Enter') {
        addBtn.click();
      }
    });
    let cnt = 1;

    function addTodo() {
      // 3. 사용자가 입력한 항목을 가져온다.
      // const newTodo = document.getElementById('new-todo').value;
      const newTodo = document.getElementById('new-todo');
      newTodo.value = newTodo.value.trim();

      // 개선 1. 빈 값 입력을 막는다.
      if (newTodo.value == '') {
        console.log('공백은 등록할 수 없습니다.');
        return -1;
      }

      // if (newTodo.value != '') { // 개선 1. 빈 값 입력을 막는다.
      // 4. 새로운 li를 생성한다.
      try {
        const new_li = document.createElement('li');
        if (new_li == null) {
          console.log('Error: Element 생성에 실패했습니다.');
        } else {
          // new_li.setAttribute('id', `item${cnt}`);
          new_li.textContent = newTodo.value + ' ';
          new_li.addEventListener('click', () => {
            new_li.classList.toggle('completed');
          });

          // const button = document.createElement('button');
          // button.textContent = '삭제';

          new_li.innerHTML = new_li.textContent + '<button>삭제</button>';

          const button = document.createElement('button');
          button.textContent = '삭제';

          // button.setAttribute('id', `delItem${cnt}`);
          button.addEventListener('click', () => {
            // button.parentElement.parentElement.removeChild(button.parentElement);
            // button.parentNode.parentNode.removeChild(button.parentNode);
            new_li.remove();
          })
          new_li.appendChild(button);

          cnt++;
        }

        // 5. 생성한 li를 ul에 추가한다.
        const todoList = document.getElementById('todo-list');
        const result = todoList.appendChild(new_li);
        if (result == null) {
          console.log('Error: To-do 추가 작업이 실패했습니다.');
        } else {
          // 개선 2. To-do 등록 작업이 성공했으면 입력칸을 지운다.
          newTodo.value = '';
        }
      } catch (err) {
        console.log('Exception: ', err);
      }
    }
  </script>
</body>

</html>
