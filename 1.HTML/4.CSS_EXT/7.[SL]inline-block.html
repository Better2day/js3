<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0px;
    }

    span {
      background: yellow;
      width: 200px;
      height: 80px;
      margin: 20px;
      padding: 10px;
    }

    div {
      background: yellow;
      width: 200px;
      height: 50px;
      margin: 20px;
      padding: 10px;
    }

    span.ib {
      display: inline-block;
      background: yellow;
      width: 200px;
      height: 50px;
      margin: 20px;
      padding: 10px;
      text-align: center;
      align-content: center;
    }
  </style>
</head>

<body>

  before
  <a>A</a>
  <span>SPAN (inline)</span>
  <em>EM</em>
  after
  <br>
  <hr>
  before
  <h1>H1</h1>
  <div>DIV</div>
  <p>P</p>
  <br>
  <hr>
  before
  <a>A</a>
  <span class="ib">SPAN (inline-block)</span>
  <em>EM</em>
  after
</body>

</html>
