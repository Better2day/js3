<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 폰트는 주 → 부 (fallback. 앞 폰트가 실패했을 때*/
    .p1 {
      /* fallback 지정. 첫 폰트가 client device에 없을 때 사용할 대체 폰트 */
      font-family: "Times New Roman", Times, serif;
    }

    .p2 {
      font-family: "Arial", "Helvetica", "Gulim";
      /* font-size: 16px; */
    }

    .p3 {
      font-family: "바탕", "Batang", "Gulim"
    }

    .p4 {
      /* font-family: "맑은고딕"; */
      font-family: "Times New Roman";
      /* text-shadow: offset-x | offset-y | blur-radius | color */
      text-shadow: 5px 2px 2px yellow;
      text-decoration: line-through;
      letter-spacing: 2px;
    }

    .p5 {
      font-family: "Times New Roman";
      text-shadow: 5px 2px 2px yellow;
    }

    .p6 {
      font-family: "Times New Roman";
      text-shadow: 5px 2px 2px yellow;
      text-decoration: line-through;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <h1>다양한 폰트 테스트</h1>
  <p class="p1">This is Times New Roman font</p>
  <p class="p2">This is Times New Roman font</p>
  <p class="p3">This is Times New Roman font</p>
  <p class="p4">This is Times New Roman font</p>
  <p class="p5">This is Times New Roman font</p>
  <p class="p6">This is Times New Roman font</p>
  <p class="p7">This is Times New Roman font</p>
</body>

</html>
