<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM - Users</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      position: relative;
      width: 100vw;
    }

    body>* {
      width: 70%;
      margin: 0 auto;
    }

    nav {
      height: 5vh;
      color: #ccc;
      background-color: #333;
      padding: 20px;
      display: flex;
      align-items: center;
    }

    main {
      /* width: 70%; */
      /* margin: 0 auto; */
      height: 90vh;
      margin: 10px auto;
    }

    table {
      width: 100%;
      border: 1px solid black;
      border-collapse: collapse;
    }

    ul {
      display: flex;
      list-style: none;
    }

    li {
      margin-right: 10px;
    }

    th,
    td {
      border: 1px solid black;
    }

    th {
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <ul>
        <li>User</li>
        <li>Order</li>
        <li>OrderItem</li>
        <li>Item</li>
        <li>Store</li>
      </ul>
    </nav>
  </header>

  <main>
    <table id="user-table">
      <thead>
        <tr></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>Copyright reserved.</footer>
  <script src="./scripts/users.js"></script>
</body>

</html>
