<body>
  <header>
    <nav class="navbar navbar-expand-sm bg-dark">
      <ul class="navbar-nav ms-2 me-auto">

          <a href="/users" class="nav-link text-light">User</a>

      <form id="searchForm" class="d-flex align-items-center gap-2 py-1" role="search">

        <input type="text" id="name" class="form-control w-auto">
        <label for="gender">Gender</label>
        <select id="gender" class="form-select form-select-sm w-auto">
          <option></option>

        </select>
        <button class="btn btn-secondary">Search</button>
      </form>
    </section>
    <section>
      <div class="user-data">
        <table id="user-table" class="table table-striped table-hover">
          <thead>
            <tr></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div>
        <nav id="pagination">
          <ul class="pagination justify-content-center"></ul>
        </nav>
      </div>
    </section>
