<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #chat-box {
      width: 400px;
      height: 400px;
      border: 1px solid #ddd;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }

    .message {
      margin-bottom: 10px;
    }

    .message strong {
      color: blue;
    }
  </style>
</head>

<body>
  <h1>SSE를 이용한 채팅</h1>
  <div id="chat-box"></div>
  <input type="text" id="username" placeholder="Username" />
  <input type="text" id="message" placeholder="메시지를 입력하세요" />
  <button onclick="sendMessage()">전송</button>

  <script>
    const eventSource = new EventSource('/chat');
    const username = document.getElementById('username');
    const message = document.getElementById('message');
    const chatDiv = document.getElementById('chat-box');

    // 메시지 받아오기
    eventSource.onmessage = event => {
      const data = JSON.parse(event.data);

      if (!data.id) {
        // 원래대로 처리
        const newMsg = document.createElement('div');
        newMsg.classList.add('message');
        newMsg.innerHTML = `<i>${data.timestamp}</i> <strong>${data.username}</strong>: ${data.message}`;
        chatDiv.appendChild(newMsg);
        chatDiv.scrollTop = chatDiv.scrollHeight; // 자동 스크롤
      } else {
        // Stream chunk data 처리
        let messageElement = chatDiv.querySelector(`.message[data-id="${data.id}"]`);

        // 이전에 없으면? 새로 DOM 요소 생성 / 있으면 뒤에 span으로 append
        if (!messageElement) {
          console.log('.message[data-id=값] 클래스를 가진 div 발견하지 못 함');
          messageElement = document.createElement('div');
          messageElement.classList.add('message');
          messageElement.dataset.id = data.id;

          messageElement.innerHTML = `<strong>${data.username}</strong>: <span class="text"></span>`;
          chatDiv.appendChild(messageElement);
        }

        const textSpan = messageElement.querySelector('.text');

        // 가장 중요한 부분
        if (data.chunk) {
          textSpan.textContent += data.chunk;
        }
      }
    }

    // 메시지 보내기
    function sendMessage() {
      const name = username.value.trim();
      const msg = message.value.trim();
      // console.log(name, msg);

      fetch('/send-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: name, message: msg })
      }).then(res => {
        message.value = ''; // 입력창 클리어
      })
    };
  </script>
</body>

</html>
