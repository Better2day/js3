<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #chat-box {
      width: 400px;
      height: 400px;
      border: 1px solid #ddd;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }

    .message {
      margin-bottom: 10px;
    }

    .message strong {
      color: blue;
    }
  </style>
</head>

<body>
  <h1>SSE를 이용한 채팅</h1>
  <div id="chat-box"></div>
  <input type="text" id="username" placeholder="Username" />
  <input type="text" id="message" placeholder="메시지를 입력하세요" />
  <button onclick="sendMessage()">전송</button>

  <script>
    const eventSource = new EventSource('/chat');
    const username = document.getElementById('username');
    const message = document.getElementById('message');
    const chatDiv = document.getElementById('chat-box');

    // 메시지 받아오기
    eventSource.onmessage = event => {
      const data = JSON.parse(event.data);
      const newMsg = document.createElement('div');
      newMsg.classList.add('message');
      newMsg.innerHTML = `<i>${data.timestamp}</i> <strong>${data.username}</strong>: ${data.message}`;
      chatDiv.appendChild(newMsg);
      chatDiv.scrollTop = chatDiv.scrollHeight; // 자동 스크롤
    }

    // 메시지 보내기
    function sendMessage() {
      const name = username.value.trim();
      const msg = message.value.trim();
      // console.log(name, msg);

      fetch('/send-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: name, message: msg })
      }).then(res => {
        message.value = ''; // 입력창 클리어
      })
    };
  </script>
</body>

</html>
