<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>User</title>
</head>

<body>
  <div class="container mt-5">
    <h1 class="h4 mb-4">내 정보</h1>

    <div id="profileImg" class="mb-3"></div>

    <ul id="info" class="list-group"></ul>

    <a href="/dashboard" class="btn btn-link mt-3">대시보드로</a>
  </div>

  <script>
    const ul = document.getElementById('info');

    fetch('/api/user')
      .then(res => res.json())
      .then(user => {
        // const li = document.createElement('li');
        // li.classList.add('list-group-item');
        // li.innerHTML = data.nickname;
        ul.innerHTML =
          `<li class="list-group-item">${user.nickname}</li>` +
          `<li class="list-group-item"><img src="${user.profile_image}"></li>` +
          // `<li class="list-group-item">${user.profile_image}</li>` +
          `<li class="list-group-item">${user.age}</li>` +
          `<li class="list-group-item">${user.gender}</li>` +
          `<li class="list-group-item">${user.email}</li>` +
          `<li class="list-group-item">${user.mobile}</li>` +
          `<li class="list-group-item">${user.name}</li>` +
          // `<li class="list-group-item">${user.birth}-${user.birthday}</li>`;
          `<li class="list-group-item">${user.birthdate}</li>`;
        // Mission. <li class="list-group-item">정보</li> 형태로 사용자 정보 출력
        // 사용자 사진, 이름, 이메일, 닉네임, 성별, 생년월일, 전화번호 (없으면 N/A로 출력)
        // user = { nickname, profile_image, age, gender, email, mobile, name, birthday, birthyear };
      });
  </script>
</body>

</html>
