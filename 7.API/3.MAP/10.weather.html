<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    #map {
      height: 480px;
    }
  </style>
</head>

<body>
  <h1>서울시 날씨 지도</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([37.5665, 126.9780], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

    // 서울시 구별 중심 좌표 (샘플 데이터)
    const seoulDistricts = [
      { name: 'Jongno- gu', lat: 37.573050, lng: 126.979189 },
      { name: 'Jung - gu', lat: 37.561128, lng: 126.994303 },
      { name: 'Yongsan - gu', lat: 37.532598, lng: 126.990257 },
      { name: 'Gangnam - gu', lat: 37.517236, lng: 127.047325 },
      { name: 'Seocho - gu', lat: 37.483570, lng: 127.032646 },
      { name: 'Songpa - gu', lat: 37.514575, lng: 127.105981 },
      { name: 'Mapo - gu', lat: 37.563756, lng: 126.908421 },
      { name: 'Gangdong - gu', lat: 37.530125, lng: 127.123764 }
    ];

    // const apiKey = 'PUT_YOUR_API_KEY_HERE'; // 실제 키는 나중에 깃헙에 커밋하지 않도록 주의
    const apiKey = 'API_KEY'; // 나중에 깃헙에 커밋하지 않도록 주의

    seoulDistricts.forEach(gu => {
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${gu.lat}&lon=${gu.lng}&units=metric&appid=${apiKey}`;
      // const url = `https://api.openweathermap.org/data/3.0/onecall?lat=${gu.lat}&lon=${gu.lng}&units=metric&appid=${apiKey}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          console.log(data);
          const temp = data.main.temp; // 현재 온도
          const weather = data.weather[0].description; // 날씨 설명
          const icon = data.weather[0].icon; // 날씨 아이콘 코드

          // 날씨 icon URL
          const iconUrl = `https://openweathermap.org/img/wn/${icon}.png`;

          // 마커 추가
          const marker = L.marker([gu.lat, gu.lng]).addTo(map);
          marker.bindPopup(`
            <div class="weather-popup">
              <img src="${iconUrl}" alt="${weather}" /><br />
              <strong>${gu.name}</strong><br />
              ${weather}<br />
              <span>${temp}&deg;C</span>
            </div>
          `);


        })
    });
  </script>
</body>

</html>
