    touristSpots2.forEach(spot => {
      let marker = L.marker(spot.location).addTo(map).bindPopup(spot.name);

      marker.on('click', () => {
        // 이미지 로드가 완료된 다음에 팝업을 띄운다.
        let image = new Image();
        image.src = spot.imageUrl;
        image.style.width = '100%';

        image.onLoad = () => {
          let popupContent = `
          <div>
            <h3>${spot.name}</h3>
            <p>${spot.description}</p>
            <img src="${spot.imageUrl}" style="width: 150px">
          </div>
          `;

          let popup = L.popup().setLatLng(spot.location).setContent(popupContent).openOn(map);
          // map.flyTo(spot.location, 14)
        }
      }); // 클릭했을 때 그 마커로 이동하는 애니메이션 효과
    });
