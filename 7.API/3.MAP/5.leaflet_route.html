<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    #map {
      height: 480px;
    }
  </style>
</head>

<body>
  <label for="start">출발지(lat, lng):</label>
  <input type="text" id="start" value="37.5665, 126.9784" placeholder="예: 37.5665, 126.9784" />
  <label for="start">도착지(lat, lng):</label>
  <input type="text" id="end" value="37.4979, 126.0276" placeholder="예: 37.4979, 126.0276" />
  <button onclick="findRoute()">경로 찾기</button>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([37.5665, 126.9784], 13); // [latitude, longitude], zoom level

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

    function findRoute() {
      let startInput = document.getElementById('start').value;
      let endInput = document.getElementById('end').value;

      let startCoord = startInput.split(',').map(coord => parseFloat(coord.trim()));
      let endCoord = endInput.split(',').map(coord => parseFloat(coord.trim()));
      console.log(startInput, startCoord);
      console.log(endInput, endCoord);

      let route = L.polyline([startCoord, endCoord], { color: 'blue' }).addTo(map);

    }
  </script>
</body>

</html>
